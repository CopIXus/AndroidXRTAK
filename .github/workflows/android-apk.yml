# CI APK artifact (no Release). Same Unity secrets as release-apk.yml.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - "ci/**"
      - ".github/workflows/android-apk.yml"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/verify-no-secrets.ps1
        shell: pwsh

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: jlumbroso/free-disk-space@v1.3.1

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.3.20f1
          targetPlatform: Android
          androidExportType: androidPackage
          customBuildMethod: TakXr.Editor.TakXrEditorMenu.BuildAndroidApk

      - run: ./ci/verify-apk-no-secrets.ps1 -ApkPath Builds/Android/TAKXR.apk
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: TAKXR-apk
          path: Builds/Android/TAKXR.apk
          if-no-files-found: error
