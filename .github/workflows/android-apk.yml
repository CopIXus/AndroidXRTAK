# CI APK artifact (no GitHub Release). Same Unity secrets as release-apk.yml.
# Manual only — do not burn a Unity license on every push.
name: Android APK

on:
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/verify-no-secrets.ps1
        shell: pwsh

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Require Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD secrets."
            echo "::error::https://game.ci/docs/github/activation"
            exit 1
          fi

      - name: Fetch Cesium for Unity tarball
        shell: pwsh
        run: ./ci/fetch-cesium.ps1

      - uses: jlumbroso/free-disk-space@v1.3.1

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.3.20f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: TakXr.Editor.TakXrEditorMenu.BuildAndroidApk
          buildsPath: Builds
          buildName: TAKXR

      - name: Locate APK
        shell: pwsh
        run: ./ci/locate-apk.ps1 -Dest Builds/Android/TAKXR.apk

      - run: ./ci/verify-apk-no-secrets.ps1 -ApkPath Builds/Android/TAKXR.apk
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: TAKXR-apk
          path: Builds/Android/TAKXR.apk
          if-no-files-found: error
