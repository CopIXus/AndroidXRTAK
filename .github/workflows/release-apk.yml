# Build TAKXR.apk on GitHub Actions (GameCI) and attach to a Release.
# Requires repo secrets: UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE
# Activate: https://game.ci/docs/github/activation
#
# Trigger: push tag v*  OR  Actions → Release APK → Run workflow

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version when no tag (e.g. 0.1.2)"
        required: false
        default: "0.1.2"

permissions:
  contents: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no server secrets in repo
        shell: pwsh
        run: ./ci/verify-no-secrets.ps1

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Require Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::GitHub Actions cannot build a Unity APK without license secrets."
            echo "::error::Add UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD at"
            echo "::error::https://github.com/CopIXus/AndroidXRTAK/settings/secrets/actions"
            echo "::error::See https://game.ci/docs/github/activation"
            exit 1
          fi

      - name: Guard — no certs in checkout
        shell: pwsh
        run: |
          if (Test-Path "Assets/StreamingAssets/local-config.json") { throw "local-config.json present" }
          if (Get-ChildItem "Assets/StreamingAssets" -Filter "*.p12" -ErrorAction SilentlyContinue) {
            throw "*.p12 present in StreamingAssets"
          }

      - name: Fetch Cesium for Unity tarball
        shell: pwsh
        run: ./ci/fetch-cesium.ps1

      - name: Free disk space (Android builds are large)
        uses: jlumbroso/free-disk-space@v1.3.1

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Build Android APK (Unity 6000.3.20f1)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 6000.3.20f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: TakXr.Editor.TakXrEditorMenu.BuildAndroidApk
          buildsPath: Builds
          buildName: TAKXR

      - name: Locate APK
        shell: pwsh
        run: ./ci/locate-apk.ps1 -Dest Builds/Android/TAKXR.apk

      - name: Verify APK has no embedded cert
        shell: pwsh
        run: ./ci/verify-apk-no-secrets.ps1 -ApkPath Builds/Android/TAKXR.apk

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$($env:INPUT_VERSION)"
            if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TAKXR ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: Builds/Android/TAKXR.apk
          fail_on_unmatched_files: true
          body: |
            Samsung Galaxy XR / Android XR APK (`us.copix.takxr`).

            No enrolled TAK cert or server hostname in this build — configure in-headset
            (Servers panel / QR) and import your client P12.

            ```powershell
            adb install -r TAKXR.apk
            adb shell am start -n us.copix.takxr/com.unity3d.player.UnityPlayerGameActivity
            ```
