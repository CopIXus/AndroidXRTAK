# Publish a GitHub Release with TAKXR.apk when a version tag is pushed.
# Requires a self-hosted Windows runner with Unity 6000.3 + Android Build Support.
#
# Tag example:
#   git tag v0.1.2
#   git push origin v0.1.2
#
# Or: Actions → Release APK → Run workflow
#
# Public APKs are built from a clean checkout (no local-config.json / takclient.p12).
# Users add their own TAK server + cert on device (Servers panel / QR / Import cert).

name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version when no tag (e.g. 0.1.2)"
        required: false
        default: "0.1.2"

permissions:
  contents: write

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no server secrets
        shell: pwsh
        run: ./ci/verify-no-secrets.ps1

  build:
    needs: secret-scan
    runs-on: [self-hosted, Windows, Unity]
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no certs or local-config in workspace
        shell: pwsh
        run: |
          $bad = @()
          if (Test-Path "Assets/StreamingAssets/local-config.json") { $bad += "local-config.json" }
          $bad += @(Get-ChildItem "Assets/StreamingAssets" -Filter "*.p12" -ErrorAction SilentlyContinue | ForEach-Object { $_.Name })
          if ($bad.Count -gt 0) {
            throw "Refusing to build release APK with secrets present: $($bad -join ', ')"
          }
          Write-Host "Clean checkout — safe for public APK."

      - name: Fetch Cesium for Unity tarball
        shell: pwsh
        run: ./ci/fetch-cesium.ps1

      - name: Ensure Android SDK components
        shell: pwsh
        run: ./ci/ensure-android-sdk.ps1

      - name: Build APK
        shell: pwsh
        run: ./ci/build-android.ps1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAKXR-apk
          path: Builds/Android/TAKXR.apk
          if-no-files-found: error

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v$($env:INPUT_VERSION)"
            if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release tag: $tag"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TAKXR ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: Builds/Android/TAKXR.apk
          fail_on_unmatched_files: true
          body: |
            Samsung Galaxy XR / Android XR APK (`us.copix.takxr`).

            This build has **no enrolled TAK cert or server hostname** — add your
            server in-headset (Servers panel / QR) and import a client P12.

            ```powershell
            adb install -r TAKXR.apk
            adb shell am start -n us.copix.takxr/com.unity3d.player.UnityPlayerGameActivity
            ```
